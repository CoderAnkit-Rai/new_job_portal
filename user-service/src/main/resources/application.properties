spring.application.name=user-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8889}

# Local fallback (used when config-server is unreachable)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobportal_user_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# JWT
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=8081

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
